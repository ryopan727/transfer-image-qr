version: '3'

tasks:
  default:
    desc: Restore, build, and test the solution
    cmds:
      - task: verify

  restore:
    desc: Restore solution dependencies
    cmds:
      - dotnet restore TransferImageQR.sln

  build:
    desc: Build production and test code
    deps: [restore]
    cmds:
      - dotnet build TransferImageQR.sln --no-restore

  test:
    desc: Run the fast unit test suite
    deps: [build]
    cmds:
      - dotnet test tests/TransferImageQR.UnitTests/TransferImageQR.UnitTests.csproj --no-build

  test:unit:
    desc: Run the fast unit test suite
    cmds:
      - task: test

  test:integration:
    desc: Run integration tests against a real in-process Kestrel server
    deps: [build]
    cmds:
      - dotnet test tests/TransferImageQR.IntegrationTests/TransferImageQR.IntegrationTests.csproj --no-build

  test:acceptance:
    desc: Run the MVP acceptance suite with real files, image decoding, and Kestrel
    deps: [build]
    cmds:
      - dotnet test tests/TransferImageQR.AcceptanceTests/TransferImageQR.AcceptanceTests.csproj --no-build

  test:all:
    desc: Run all unit, presentation, integration, and acceptance tests
    deps: [build]
    cmds:
      - dotnet test tests/TransferImageQR.UnitTests/TransferImageQR.UnitTests.csproj --no-build
      - dotnet test tests/TransferImageQR.IntegrationTests/TransferImageQR.IntegrationTests.csproj --no-build
      - dotnet test tests/TransferImageQR.AcceptanceTests/TransferImageQR.AcceptanceTests.csproj --no-build

  verify:
    desc: Restore, build, and run every automated test suite
    cmds:
      - task: test:all
